<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice to Text</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Voice to Text</h1>
    <p class="subtitle">Speak and watch your words appear in real time</p>

    <div class="controls">
      <select id="languageSelect" title="Language">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="it-IT">Italian</option>
        <option value="pt-BR">Portuguese (BR)</option>
        <option value="zh-CN">Chinese (Simplified)</option>
        <option value="ja-JP">Japanese</option>
        <option value="ko-KR">Korean</option>
        <option value="hi-IN">Hindi</option>
        <option value="ar-SA">Arabic</option>
        <option value="pa-IN">Punjabi</option>
      </select>

      <label class="toggle-label">
        <input type="checkbox" id="continuousToggle" checked />
        Continuous
      </label>

      <label class="toggle-label">
        <input type="checkbox" id="interimToggle" checked />
        Interim results
      </label>
    </div>

    <div class="transcript-box">
      <div id="transcript"></div>
      <span id="interim" class="interim"></span>
      <span class="placeholder" id="placeholder">Your transcription will appear here...</span>
    </div>

    <div class="status-bar">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Ready</span>
      <span id="wordCount" class="word-count">0 words</span>
    </div>

    <div class="button-row">
      <button id="startBtn" class="btn btn-primary">Start Recording</button>
      <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
      <button id="copyBtn" class="btn btn-ghost">Copy</button>
      <button id="clearBtn" class="btn btn-ghost btn-danger">Clear</button>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
